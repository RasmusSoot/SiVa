name: Build and Publish SiVa WebApp

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: siva-webapp

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should-publish: ${{ steps.should-publish.outputs.result }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Get version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
            if [[ "$GITHUB_REF_NAME" != "main" && "$GITHUB_REF_NAME" != "master" ]]; then
              VERSION="${VERSION}-${GITHUB_REF_NAME}-${GITHUB_SHA::8}"
            fi
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build with Maven
        env:
          TZ: Europe/Helsinki
        run: |
          ./mvnw clean compile -P jar
          ./mvnw package -P jar -pl siva-parent/siva-webapp -am -DskipTests

      - name: Run tests
        env:
          TZ: Europe/Helsinki
        run: ./mvnw test -pl siva-parent/siva-webapp

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: siva-webapp-jar
          path: siva-parent/siva-webapp/target/siva-webapp-*-exec.jar
          retention-days: 7

      - name: Should publish?
        id: should-publish
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]] && ([[ "$GITHUB_REF_NAME" == "main" ]] || [[ "$GITHUB_REF_NAME" == "master" ]] || [[ "$GITHUB_REF_NAME" == "develop" ]] || [[ $GITHUB_REF == refs/tags/* ]]); then
            echo "result=true" >> $GITHUB_OUTPUT
          else
            echo "result=false" >> $GITHUB_OUTPUT
          fi

  publish-docker:
    needs: build
    if: needs.build.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: siva-webapp-jar
          path: siva-parent/siva-webapp/target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.build.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./siva-parent/siva-webapp
          file: ./siva-parent/siva-webapp/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  publish-helm:
    needs: [build, publish-docker]
    if: needs.build.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.12.0'

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Helm chart version
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          sed -i "s/^version:.*/version: ${VERSION}/" helm-chart/siva-webapp/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: ${VERSION}/" helm-chart/siva-webapp/Chart.yaml

      - name: Package Helm chart
        run: |
          helm dependency update helm-chart/siva-webapp
          helm package helm-chart/siva-webapp --destination .

      - name: Push Helm chart to OCI registry
        run: |
          CHART_VERSION="${{ needs.build.outputs.version }}"
          helm push siva-webapp-${CHART_VERSION}.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/helm-charts

  security-scan:
    needs: publish-docker
    if: needs.build.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.version }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'