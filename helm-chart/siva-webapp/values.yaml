replicaCount: 1

image:
  repository: siva-webapp
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: siva-webapp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

healthcheck:
  enabled: true
  livenessProbe:
    httpGet:
      path: /monitoring/heartbeat
      port: http
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /monitoring/health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

config:
  spring:
    http:
      encoding:
        charset: UTF-8
        enabled: true
        force: true
  siva:
    http:
      request:
        maxRequestSizeLimit: "27MB"
  management:
    health:
      diskspace:
        enabled: false
    endpoints:
      web:
        exposure:
          include:
            - health
            - heartbeat
            - version
        basePath: /monitoring
    endpoint:
      health:
        showDetails: "ALWAYS"
      heartbeat:
        enabled: true
        cache:
          timeToLive: 10s
      version:
        enabled: true

persistence:
  enabled: false
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi

env: []

envFrom: []

volumes: []

volumeMounts: []